<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="livaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0f172a" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#livaGrad)"/>
  
  <!-- Inner Glow / Border ring -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#ffffff" stroke-width="3" stroke-opacity="0.2"/>
  
  <!-- Stylized Monogram "L" and broadcast spark -->
  <g filter="url(#shadow)">
    <!-- Main Letter L -->
    <path d="M 160 120 C 160 108.954 168.954 100 180 100 L 210 100 C 221.046 100 230 108.954 230 120 L 230 330 C 230 335.523 234.477 340 240 340 L 330 340 C 341.046 340 350 348.954 350 360 L 350 390 C 350 401.046 341.046 410 330 410 L 180 410 C 168.954 410 160 401.046 160 390 Z" fill="url(#starGrad)"/>
    
    <!-- Live shopping / Sparkle Symbol -->
    <path d="M 330 150 C 330 190 310 210 270 210 C 310 210 330 230 330 270 C 330 230 350 210 390 210 C 350 210 330 190 330 150 Z" fill="#38bdf8"/>
    <circle cx="370" cy="130" r="14" fill="#fbbf24"/>
  </g>
</svg>
