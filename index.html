<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover" />
    <title>Liva Agency</title>
    
    <!-- PWA Primary Meta Tags -->
    <meta name="theme-color" content="#772bf2" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Liva Agency" />
    <meta name="description" content="Sistem Manajemen Operasional & Live Streaming Liva Media Kreatif" />

    <!-- Web Manifest & Icons -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <!-- Early PWA Install Prompt Capture for Android -->
    <script>
      window.__deferredPwaPrompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.__deferredPwaPrompt = e;
        window.dispatchEvent(new CustomEvent('pwa-prompt-ready'));
      });

      // Auto-recovery for stale PWA cache / missing bundle chunks after deployment
      window.addEventListener('error', function(e) {
        var msg = (e && e.message) ? String(e.message) : '';
        var isChunkError = 
          msg.indexOf('MIME type') !== -1 || 
          msg.indexOf('Loading chunk') !== -1 || 
          msg.indexOf('Failed to fetch dynamically imported module') !== -1 ||
          msg.indexOf('Importing a module script failed') !== -1;
        
        if (isChunkError && !sessionStorage.getItem('pwa_chunk_recovered')) {
          sessionStorage.setItem('pwa_chunk_recovered', '1');
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              for (var i = 0; i < regs.length; i++) {
                regs[i].unregister();
              }
            });
          }
          if ('caches' in window) {
            caches.keys().then(function(keys) {
              return Promise.all(keys.map(function(k) { return caches.delete(k); }));
            }).then(function() {
              window.location.reload();
            });
          } else {
            window.location.reload();
          }
        }
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
